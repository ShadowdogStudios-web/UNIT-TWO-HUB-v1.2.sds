function b64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function unlock(pw){
 if(!(window.crypto&&crypto.subtle)){msg.className='msg err';msg.textContent='This page must be opened over the web link (https) to unlock. Ask your teacher for the link.';return;}
 msg.className='msg';msg.textContent='Checking…';
 try{
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey('raw',enc.encode(pw),{name:'PBKDF2'},false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,256);
  var kek=await crypto.subtle.importKey('raw',bits,{name:'AES-GCM'},false,['decrypt']);
  var contentKeyRaw=null;
  for(var i=0;i<P.wraps.length;i++){
   try{contentKeyRaw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.wraps[i].iv)},kek,b64(P.wraps[i].ct));break;}catch(e){}
  }
  if(!contentKeyRaw){msg.className='msg err';msg.textContent='That password didn\'t work. Try again.';return;}
  var ck=await crypto.subtle.importKey('raw',contentKeyRaw,{name:'AES-GCM'},false,['decrypt']);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.civ)},ck,b64(P.cct));
  var html=new TextDecoder().decode(plain);
  msg.className='msg ok';msg.textContent='Unlocked.';
  var f=document.getElementById('exam');f.srcdoc=html;document.body.classList.add('unlocked');
