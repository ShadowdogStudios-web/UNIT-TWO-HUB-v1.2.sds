<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sherman's March to the Sea — Promise &amp; Practice</title>
<style>
:root{
 --accent:#e0805f;--accent2:#f0a184;--ink:#f4ede2;--body:#d8ccbb;--mut:#a1917d;--gray:#c3b4a1;
 --panel:#211a12;--panel2:#1b150e;--hair:rgba(255,255,255,.12);--line:rgba(255,255,255,.12);--green:#83c39a;
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:#14100c;color:var(--body);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.gbg{background:radial-gradient(120% 130% at 78% 12%,#241a12 0%,#16120d 58%,#100c09 100%)}
/* ---------- carousel ---------- */
.stage{position:relative;height:100vh;overflow:hidden;border-bottom:1px solid var(--hair)}
.track{display:flex;height:100%;transition:transform .55s cubic-bezier(.4,.02,.15,1)}
.slide{min-width:100%;height:100%;overflow-y:auto;overflow-x:hidden;position:relative}
.read{min-height:100%;box-sizing:border-box;max-width:900px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;padding:clamp(38px,6vh,84px) clamp(26px,5vw,64px) clamp(76px,10vh,116px)}
.read.center{text-align:center;align-items:center}
.read.top{justify-content:flex-start;max-width:1200px;padding:clamp(52px,7vh,66px) clamp(18px,3.5vw,44px) clamp(28px,4.5vh,52px)}
.read.top h2{font-size:clamp(23px,3vw,34px)}
.read.top .sub{font-size:clamp(14px,1.5vw,17px);margin-top:11px;max-width:70ch}
.read.top .arule{margin:11px 0 14px}
.read .kick{text-align:inherit}
.fig{margin:24px 0 8px;text-align:center;width:100%}
.fig img{max-width:100%;max-height:46vh;width:auto;height:auto;border-radius:10px;display:inline-block;box-shadow:0 6px 30px rgba(0,0,0,.5)}
.fig svg{max-width:100%;max-height:68vh;height:auto;display:block;margin:0 auto;border-radius:10px}
.read.top .fig{margin:6px 0 8px}
.fig figcaption{font-size:12px;color:var(--mut);margin:10px auto 0;line-height:1.4;max-width:76ch}
/* ---- animated maps ---- */
.fig .aline{stroke-dasharray:var(--len,700);stroke-dashoffset:var(--len,700)}
.fig.route.play .aline{animation:mdraw 2.1s ease forwards}
.fig.route .areveal{opacity:0}
.fig.route.play .areveal{animation:mappear .6s ease forwards 1.7s}
.fig .apulse{transform-box:fill-box;transform-origin:center}
.fig.route.play .apulse{animation:mappear .6s ease forwards 1.7s, mpulse 1.5s ease-in-out 2.3s 3}
@keyframes mdraw{to{stroke-dashoffset:0}}
@keyframes mappear{to{opacity:1}}
@keyframes mpulse{0%,100%{opacity:1}50%{opacity:.4}}
.fig .dgrp{opacity:0}
.fig .dgrp.on{opacity:1;transition:opacity .4s ease}
.fig .dgrp.on .aline{animation:mdraw 1.1s ease forwards}
.fig .dgrp .areveal{opacity:0}
.fig .dgrp.on .areveal{animation:mappear .5s ease forwards .55s}
.fig .dgrp.on .apulse{animation:mappear .5s ease forwards .55s}
.mapctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin:4px auto 12px}
.mapctrl .mb{font:inherit;font-weight:700;font-size:13px;letter-spacing:.02em;color:var(--gray);background:#1b150e;border:1px solid var(--hair);border-radius:22px;padding:8px 16px;cursor:pointer;transition:.15s}
.mapctrl .mb:hover{border-color:var(--accent);color:var(--accent)}
.mapctrl .mb.on{background:var(--accent);border-color:var(--accent);color:#1a1109}
.mapctrl .mb.rep{color:var(--accent)}
.mapctrl .sep{width:1px;height:20px;background:var(--hair);margin:0 4px}
@media(prefers-reduced-motion:reduce){.fig .aline{stroke-dashoffset:0!important;animation:none!important}.fig .areveal,.fig .apulse{opacity:1!important;animation:none!important}.fig .dgrp{transition:none!important}}
.statgrid{display:flex;flex-wrap:wrap;gap:clamp(14px,3vw,40px);justify-content:center;margin:26px 0 8px;width:100%}
.statgrid .st{flex:1 1 170px;min-width:150px;max-width:280px;text-align:center}
.statgrid .st .n{font-size:clamp(34px,5vw,62px);font-weight:200;line-height:1;color:var(--accent);letter-spacing:-.02em}
.statgrid .st .l{margin-top:10px;font-size:14px;line-height:1.35;color:var(--gray)}
.kick{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.arule{width:52px;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin:16px 0 22px}
.center .arule{margin-left:auto;margin-right:auto;background:var(--accent)}
h1{font-size:clamp(40px,6.4vw,86px);font-weight:200;line-height:1.0;letter-spacing:-.02em;margin:0;color:var(--ink)}
h2{font-size:clamp(27px,3.8vw,46px);font-weight:300;line-height:1.06;letter-spacing:-.01em;margin:0;color:var(--ink)}
.sub{margin-top:20px;font-size:clamp(15px,2vw,21px);color:var(--gray);max-width:42ch}
.center .sub{margin-left:auto;margin-right:auto}
.p{margin:14px 0 0;font-size:clamp(15px,1.35vw,18px);line-height:1.62;color:var(--body);max-width:56ch}
.p b{color:var(--ink)}
.read.center .p{text-align:left;max-width:60ch;margin-left:auto;margin-right:auto}
.dqbox{margin-top:26px;border:1px solid var(--hair);border-left:3px solid var(--accent);background:var(--panel);border-radius:10px;padding:16px 18px;max-width:56ch}
.center .dqbox{text-align:left;margin-left:auto;margin-right:auto}
.dqbox .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:5px}
.dqbox .t{font-size:17px;color:var(--ink);line-height:1.45}
.pq{margin-top:26px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:18px 0;max-width:56ch}
.center .pq{text-align:left;margin-left:auto;margin-right:auto}
.pq .pql{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;display:block;margin-bottom:8px}
.pq .pqt{font-size:clamp(17px,1.7vw,22px);font-weight:300;line-height:1.4;color:var(--ink)}
.pq cite{display:block;margin-top:10px;font-size:12px;letter-spacing:.06em;color:var(--mut);font-style:normal}
.quote{font-weight:200;font-size:clamp(24px,3.4vw,46px);line-height:1.28;letter-spacing:-.01em;color:var(--ink);max-width:24ch}
.center .quote{max-width:26ch}
.qby{margin-top:20px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
.qbox{margin-top:26px;font-weight:200;font-size:clamp(19px,2.3vw,32px);line-height:1.32;color:var(--ink);max-width:26ch}
.cta{margin-top:34px;font:inherit;font-weight:700;font-size:16px;letter-spacing:.02em;padding:15px 30px;border-radius:30px;border:1px solid var(--accent);background:var(--accent);color:#1a1109;cursor:pointer}
.cta:hover{background:var(--accent2);border-color:var(--accent2)}
/* controls */
.stage .arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:30;width:46px;height:46px;border-radius:50%;border:1px solid var(--hair);background:rgba(30,23,16,.82);color:var(--ink);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stage .arrow:hover{border-color:var(--accent);color:var(--accent)}
.stage .arrow.prev{left:18px}.stage .arrow.next{right:18px}.stage .arrow:disabled{opacity:.26;cursor:default}
.dots{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:8px;background:rgba(20,15,10,.72);padding:9px 14px;border-radius:22px;border:1px solid var(--hair)}
.dot{width:8px;height:8px;border-radius:50%;border:none;background:#4c3d2e;cursor:pointer;padding:0}
.dot.on{background:var(--accent)}
.count{position:absolute;top:18px;left:22px;z-index:30;font-size:12.5px;font-weight:700;letter-spacing:.1em;color:var(--gray);background:rgba(20,15,10,.72);padding:6px 12px;border-radius:20px;border:1px solid var(--hair)}
.backbtn{position:absolute;top:16px;right:20px;z-index:30;font:inherit;font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--accent);text-decoration:none;background:rgba(20,15,10,.82);border:1px solid var(--hair);border-radius:20px;padding:8px 15px;cursor:pointer;display:flex;align-items:center;gap:6px}
.backbtn:hover{border-color:var(--accent);background:rgba(224,128,95,.14)}
.crumb{position:absolute;top:52px;right:20px;z-index:29;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:right;pointer-events:none}
.audioctl{position:absolute;bottom:18px;left:20px;z-index:31;display:none;align-items:center;gap:6px;background:rgba(20,15,10,.82);border:1px solid var(--hair);border-radius:22px;padding:5px 6px}
.audioctl.show{display:flex}
.audioctl button{width:34px;height:34px;border-radius:50%;border:1px solid var(--hair);background:#221a12;color:var(--ink);cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.audioctl button:hover{border-color:var(--accent);color:var(--accent)}
.audioctl button.off{background:#1b150e;color:var(--mut)}
.audioctl .abtn.playing{background:var(--accent);border-color:var(--accent);color:#1a1109}
.audioctl .alabel{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:0 6px 0 3px}
.audiohint{position:absolute;bottom:60px;left:20px;z-index:31;display:none;background:var(--accent);color:#1a1109;font-size:12px;font-weight:700;padding:7px 12px;border-radius:8px}
.audiohint.show{display:block;animation:afade 4s ease forwards}
@keyframes afade{0%,70%{opacity:1}100%{opacity:0}}
/* ---------- activity ---------- */
#activity{max-width:860px;margin:0 auto;padding:52px 22px 96px}
.act-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.act-kick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.backup{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:700;cursor:pointer}
.at{font-size:clamp(26px,3.4vw,40px);font-weight:300;margin:12px 0 4px;letter-spacing:-.01em;color:var(--ink)}
.act-sub{color:var(--gray);font-size:15px;max-width:70ch;line-height:1.5}
.namer{display:flex;gap:22px;flex-wrap:wrap;font-size:15px;font-weight:600;margin:22px 0 6px}
.namer label{display:flex;align-items:center;gap:8px;color:var(--gray)}
.namer input{font:inherit;font-weight:500;border:none;border-bottom:1.5px solid var(--accent);background:transparent;padding:2px 4px;min-width:150px;color:var(--ink)}
.namer input:focus{outline:none;border-bottom-color:var(--ink)}
.howto{background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:18px 22px;margin:18px 0 10px}
.howto .h{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
.howto ol{margin:0;padding-left:20px;color:var(--body)}.howto li{margin:5px 0}
.srcdoc{border:1px solid var(--hair);border-top:3px solid var(--accent);border-radius:14px;padding:24px 26px;margin:22px 0;background:var(--panel)}
.sd-kick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.srcdoc h3{font-size:21px;font-weight:600;margin:6px 0 12px;color:var(--ink)}
.sd-quote{margin:0;font-size:16.5px;line-height:1.62;color:var(--body);border-left:3px solid var(--accent);padding-left:16px}
.sd-quote b{color:var(--ink)}
.sd-by{display:block;margin-top:10px;font-size:12px;color:var(--mut);font-style:normal}
.wstep{border:1px solid var(--hair);border-radius:14px;padding:24px 26px;margin:20px 0;background:var(--panel2)}
.stepk{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.wstep h3{font-size:22px;font-weight:600;margin:6px 0 4px;color:var(--ink)}
.wstep .wsub{font-size:14px;color:var(--gray);margin:6px 0 0}
.task{margin-top:16px}
.task .tl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.task .th{font-size:13.5px;color:var(--gray);margin:2px 0 6px}
.ta{width:100%;font:inherit;font-size:15px;border:1px solid var(--hair);border-radius:9px;padding:11px 13px;background:#171009;color:var(--ink);resize:vertical}
.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(224,128,95,.18)}
.qq{margin:18px 0 0}
.ql{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.qt{margin:4px 0 10px;font-weight:600;line-height:1.45;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--hair);background:#171009;border-radius:9px;padding:11px 14px;font:inherit;font-size:14.5px;cursor:pointer;transition:.12s;color:var(--body)}
.opt:hover{border-color:var(--accent)}.opt.sel{border-color:var(--accent);background:rgba(224,128,95,.16)}
.opt.right{border-color:#4f8a63;background:rgba(90,160,110,.18);color:var(--ink)}.opt.wrong{border-color:var(--accent);background:rgba(224,128,95,.16)}
.qfb{display:none;margin-top:10px;font-size:14px;border-radius:9px;padding:10px 13px;line-height:1.45;color:var(--body)}
.qfb.show{display:block}.qfb.ok{background:rgba(90,160,110,.14);border:1px solid #3f6b4e}.qfb.no{background:rgba(224,128,95,.12);border:1px solid #7a4a3c}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.btn{font:inherit;font-weight:700;font-size:14px;letter-spacing:.02em;padding:12px 20px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#1a1109;cursor:pointer}
.btn:hover{background:var(--accent2)}.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:rgba(224,128,95,.12)}
.savenote{font-size:12.5px;color:var(--mut);margin-top:12px}
.savenote.ok{color:var(--green);font-weight:700}
.foot-ret{margin:30px 0 0;text-align:center}
.foot-ret button{font:inherit;font-weight:700;font-size:14px;color:var(--accent);background:transparent;border:1px solid var(--hair);border-radius:24px;padding:11px 22px;cursor:pointer}
.foot-ret button:hover{border-color:var(--accent);background:rgba(224,128,95,.12)}
@media(max-width:820px){
 .stage .arrow{display:none}
 .read{padding:30px 22px 92px}.read .p{max-width:none}
 .fig img{max-height:40vh}.crumb{display:none}
}
@media print{.stage,.arrow,.dots,.count,.backbtn,.crumb,.audioctl,.audiohint,.bar,.foot-ret{display:none!important}#activity{padding:0}body{background:#fff;color:#000}}
/* ---- assessment (perspective tagging + lock + paper) ---- */
#activity{max-width:860px;margin:0 auto;padding:52px 22px 96px}
.a-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:rgba(224,128,95,.12);border:1px solid rgba(224,128,95,.3);border-radius:20px;padding:4px 11px}
.paperbtn{margin-left:auto;font:inherit;font-weight:700;font-size:12px;color:var(--gray);background:transparent;border:1px solid var(--hair);border-radius:20px;padding:6px 12px;cursor:pointer}
.paperbtn:hover{border-color:var(--accent);color:var(--accent)}
.at{font-size:clamp(26px,3.6vw,40px);font-weight:300;margin:6px 0 4px;letter-spacing:-.01em;color:var(--ink)}
.strat{font-size:13.5px;color:var(--gray)}
.policy{font-size:12px;color:var(--mut);margin:12px 0;background:var(--panel2);border:1px solid var(--hair);border-radius:8px;padding:8px 12px}
.a-intro{font-size:15.5px;line-height:1.6;color:var(--body);background:var(--panel);border:1px solid var(--hair);border-top:3px solid var(--accent);border-radius:12px;padding:16px 18px;margin:14px 0}
.tagcards{display:flex;flex-direction:column;gap:12px;margin:14px 0}
.tagcard{border:1px solid var(--hair);border-radius:12px;padding:14px 16px;background:var(--panel2)}
.tagcard .ev{font-size:15.5px;line-height:1.55;margin-bottom:11px;font-style:italic;color:var(--ink)}
.tagbtns{display:flex;gap:8px;flex-wrap:wrap}
.tagb{border:1px solid var(--hair);background:#171009;border-radius:20px;padding:8px 15px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--body)}
.tagb.sel{border-color:var(--accent);background:var(--accent);color:#1a1109}
.tagb.locked{cursor:default}
.tagcard.ok{border-color:#4f8a63;background:rgba(90,160,110,.1)}
.tagcard.no{border-color:var(--accent);background:rgba(224,128,95,.1)}
.tagwhy{margin-top:11px;font-size:13.5px;color:var(--gray);border-top:1px solid var(--hair);padding-top:10px}
.checkbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.btn{font:inherit;font-weight:700;font-size:14px;padding:12px 20px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#1a1109;cursor:pointer}
.btn:hover{background:var(--accent2)}.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:rgba(224,128,95,.12)}
.scoreline{width:100%;font-size:13.5px;color:var(--gray);margin-bottom:2px}.scoreline b{color:var(--ink)}
.lockbanner{width:100%;font-weight:700;color:var(--gray);background:var(--panel2);border:1px solid var(--accent);border-radius:10px;padding:13px 16px;font-size:14px}
.savenote{font-size:12.5px;color:var(--mut);margin-top:12px}.savenote.ok{color:var(--green);font-weight:700}
.honors{margin:22px 0 0;border:1px solid var(--hair);border-radius:12px;background:var(--panel2);overflow:hidden}
.honors summary{cursor:pointer;padding:14px 18px;font-weight:700;color:var(--accent);font-size:14px;list-style:none}
.honors summary::-webkit-details-marker{display:none}.honors summary::before{content:"★ "}
.honors .in{padding:0 18px 18px}.honors p{font-size:14.5px;color:var(--body);margin:0 0 10px}
.ta{width:100%;font:inherit;font-size:15px;border:1px solid var(--hair);border-radius:9px;padding:11px 13px;background:#171009;color:var(--ink);resize:vertical}
.ta:focus{outline:none;border-color:var(--accent)}
.foot-ret{margin:30px 0 0;text-align:center}
.foot-ret button{font:inherit;font-weight:700;font-size:14px;color:var(--accent);background:transparent;border:1px solid var(--hair);border-radius:24px;padding:11px 22px;cursor:pointer}
.foot-ret button:hover{border-color:var(--accent);background:rgba(224,128,95,.12)}
.paperview{display:none;position:fixed;inset:0;z-index:80;background:#e9e6e0;overflow:auto;padding:22px 16px 60px}
.paperview.on{display:block}
.paperbar{max-width:760px;margin:0 auto 14px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.sheet{max-width:760px;margin:0 auto;background:#fff;color:#111;border:1px solid #ccc;border-radius:6px;padding:42px 48px;font-family:Georgia,'Times New Roman',serif;line-height:1.5}
.sheet h1{font-size:21px;margin:0 0 2px;color:#111;font-weight:700}
.sheet .meta{font-size:12px;color:#555;margin:0 0 14px}
.sheet .namebar{display:flex;gap:16px;font-size:13px;margin:12px 0 18px;border-bottom:2px solid #000;padding-bottom:12px}
.sheet .namebar u{flex:1;text-decoration:none;border-bottom:1px solid #999;min-width:60px}
.sheet .dir{font-size:13.5px;margin:12px 0}
.sheet .bank{border:1px solid #000;border-radius:4px;padding:9px 13px;margin:10px 0;font-size:13px}
.sheet .pq{margin:13px 0;font-size:13.5px}
.sheet .writeline{border-bottom:1px solid #555;height:22px;margin:9px 0}
.sheet .key{margin-top:22px;border:1px dashed #b1442f;border-radius:5px;padding:12px 15px;background:#fbf4f1}
.sheet .key h3{color:#b1442f;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 8px}
.sheet .key p{font-size:12.5px;margin:4px 0;color:#222}
@media print{body>*{display:none!important}.paperview{display:block!important;position:static;background:#fff;padding:0}.paperbar{display:none!important}.sheet{border:none;max-width:100%;padding:0}.sheet .key{background:none}}
</style>
</head>
<body class="gbg">
<div class="stage gbg">
 <div class="count" id="count">01 / 01</div>
 <button class="backbtn" id="backBtn">← Back to the chapter</button>
 <div class="crumb">Deep&nbsp;Dive · Sherman's&nbsp;March</div>
 <div class="track" id="track"></div>
 <button class="arrow prev" id="prev" aria-label="Previous">‹</button>
 <button class="arrow next" id="next" aria-label="Next">›</button>
 <div class="dots" id="dots"></div>
 <div class="audiohint" id="audiohint">🔊 Click anywhere to start the narration</div>

y=\"524\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"600\" letter-spacing=\".02em\" fill=\"#c3ac93\">Milledgeville</text><polygon class=\"areveal apulse\" points=\"860.1,672.0 857.6,678.6 850.6,678.9 856.1,683.3 854.2,690.1 860.1,686.2 866.0,690.1 864.1,683.3 869.6,678.9 862.5,678.6\" fill=\"#f0a184\" stroke=\"#0d0b12\" stroke-width=\"1\"/><text x=\"867\" y=\"743\" text-anchor=\"start\" font-size=\"12\" font-weight=\"800\" letter-spacing=\".05em\" fill=\"#efe6d9\">SAVANNAH</text><text x=\"867\" y=\"790\" text-anchor=\"start\" font-size=\"9\" font-weight=\"600\" letter-spacing=\".02em\" fill=\"#f0a184\">reached Dec 21</text><text x=\"465\" y=\"820\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" letter-spacing=\".14em\" fill=\"#8a7256\">GEORGIA</text><text x=\"893\" y=\"373\" text-anchor=\"start\" font-size=\"10\" font-weight=\"700\" letter-spacing=\".14em\" fill=\"#4a5566\" transform=\"rotate(-32 893 373)\">ATLANTIC</text><text x=\"534\" y=\"211\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"600\" letter-spacing=\".02em\" fill=\"#e0805f\" class=\"areveal\">a swath 60 miles wide</text><text x=\"38\" y=\"26\" font-size=\"13.5\" font-weight=\"700\" fill=\"#efe6d9\">Atlanta to the sea — 285 miles, November–December 1864</text><text x=\"978\" y=\"1090\" text-anchor=\"end\" font-size=\"9\" fill=\"#5f5566\">State lines: Natural Earth (public domain); route generalized. © ShadowDog Digital Studios.</text></svg>", "mapcap": "Sherman's route, Nov–Dec 1864 · State lines: Natural Earth (public domain) · © ShadowDog Digital Studios."}, {"type": "content", "kick": "A new idea of war", "title": "Total War", "body": ["Sherman's target wasn't only the enemy <i>army</i> — it was the enemy's <b>ability and will to keep fighting</b>. His men tore up railroads and heated the rails to twist them into “Sherman's neckties.” They took the food, the livestock, the mills, the depots.", "<b>“War is cruelty, and you cannot refine it,”</b> Sherman wrote. He believed that making Georgia “feel the hard hand of war” would end the killing sooner. It is one of history's hardest arguments — and you'll be asked to weigh it."]}, {"type": "content", "kick": "Living off the land", "title": "The Bummers", "body": ["Foragers the soldiers nicknamed <b>“bummers”</b> stripped farms across a band sixty miles wide. Sherman's orders drew a line — take food and forage, but stay out of people's homes — and that line was often crossed.", "To the soldiers, it was survival and a soldier's rough justice on the state that started secession. To the families in its path, it was simply <b>ruin</b>. Both things were true at once."]}, {"type": "content", "kick": "Freedom on the march", "title": "The Other Army", "body": ["There was a second army on that road — one that carried no rifles. As the columns passed, <b>tens of thousands of enslaved people</b> left the plantations and followed, walking toward a freedom they could finally reach.", "For them, Sherman's march was not destruction at all. It was <b>deliverance</b> — the sound of their own liberation coming down the road."]}, {"type": "content", "kick": "The hard truth", "title": "Ebenezer Creek", "body": ["But the army's compassion had limits, and one of them has a name: <b>Ebenezer Creek</b>. To speed his own troops across, a Union general ordered the pontoon bridge pulled up behind them — <b>stranding hundreds of freed men, women, and children</b> at the water's edge as Confederate cavalry closed in behind them.", "Many drowned trying to cross; others were dragged back into slavery. Liberation and betrayal, in the very same march. This course does not look away from that."]}, {"type": "content", "kick": "Savannah · December 21", "title": "A Christmas Gift", "body": ["Sherman reached the sea and took the beautiful old port of <b>Savannah</b> almost without a fight. Then he sat down and sent Abraham Lincoln one of the most famous telegrams in American history:", "<i>“I beg to present you, as a Christmas gift, the city of Savannah.”</i> The march was complete. The Confederacy had been cut, and its heartland had been shown it could not protect itself."]}, {"type": "stat", "kick": "The cost", "title": "What the March Weighed", "stats": [["~285 mi", "Atlanta to Savannah"], ["60 mi", "width of the swath"], ["~$100M", "in damage (1864 dollars)"]], "body": ["Strangely, the march killed relatively <b>few soldiers</b>. Its power was of a different kind — it shattered the South's <b>will</b> to keep fighting and destroyed its <b>ability</b> to supply an army.", "It was less a battle than a message, written across a whole state: <b>the war has come home, and you cannot stop it.</b>"]}, {"type": "content", "kick": "The debate", "title": "Hero, or Villain?", "body": ["Few figures in American history are remembered so differently by so many. To the <b>North</b>, Sherman was the general who broke the Confederacy's back and brought the boys home sooner. To the <b>white South</b>, he was a monster who waged war on civilians. To the <b>enslaved</b>, he was a liberator.", "Here is the historian's problem: <b>all three memories are real.</b> The same march was salvation, and ruin, and mercy, and cruelty — depending entirely on where you were standing."]}, {"type": "content", "kick": "Why it matters", "title": "The Shape of Wars to Come", "body": ["Sherman's March pointed straight at the <b>total wars</b> of the next century — wars in which the home front itself becomes a target, and whole societies, not just armies, are made to break.", "And it left this course's hardest question sitting in the open, where the next chapters will have to answer it: <b>what does a nation owe the people it frees?</b>"], "pq": ["War is cruelty, and you cannot refine it.", "General William T. Sherman, 1864"]}, {"type": "launch", "kick": "Your turn", "title": "Four Voices, One March", "lead": "The same sixty days meant utterly different things to the people who lived them. Read four accounts and decide who most likely said each — like a historian sorting a source set.", "cta": "Begin the source work →"}], "img": {}, "cred": {}, "audio": []};

  const capHtml=(anim||!s.mapcap)?'':`<figcaption>${s.mapcap}</figcaption>`;
  return `${ctrl}<figure class="${cls}" data-anim="${anim}">${s.svg}${capHtml}</figure>`;
 }
 if(s.img&&IMG[s.img])return `<figure class="fig"><img src="${IMG[s.img]}" alt="">${CRED[s.img]?`<figcaption>${CRED[s.img]}</figcaption>`:''}</figure>`;
 return '';
}
function rAfter(s){

 if(s.stats)h+='<div class="statgrid">'+s.stats.map(x=>`<div class="st"><div class="n">${x[0]}</div><div class="l">${x[1]}</div></div>`).join('')+'</div>';

SL.forEach(s=>{
 const el=document.createElement('div');el.className='slide gbg';

let idx=0;const N=SL.length;
const dots=document.getElementById('dots'),count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next');
SL.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.onclick=()=>go(i);dots.appendChild(b);});
function go(i){idx=Math.max(0,Math.min(N-1,i));track.style.transform='translateX(-'+(idx*100)+'%)';
 [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===idx));
 count.textContent=String(idx+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');prev.disabled=idx===0;next.disabled=idx===N-1;
 try{history.replaceState(null,'','#s'+(idx+1));}catch(e){}
 const cur=track.children[idx];if(cur)cur.scrollTop=0;
 if(window.__mapAnim)window.__mapAnim(cur);
 if(window.__slideAudio)window.__slideAudio(idx);}
prev.onclick=()=>go(idx-1);next.onclick=()=>go(idx+1);
document.addEventListener('keydown',e=>{const t=e.target.tagName;if(t==='TEXTAREA'||t==='INPUT')return;if(window.scrollY>window.innerHeight*0.5)return;if(e.key==='ArrowLeft')go(idx-1);if(e.key==='ArrowRight')go(idx+1);});
let sx=null;track.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
track.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)go(idx+(dx<0?1:-1));sx=null;},{passive:true});
/* ---------------- per-slide narration audio (guarded) ---------------- */
(function(){
 const AUD=(DATA.audio||[]);
 if(!AUD.length||!AUD.some(Boolean)){window.__slideAudio=function(){};return;}
 const ctl=document.getElementById('audioctl'),hint=document.getElementById('audiohint');
 const bToggle=document.getElementById('aToggle'),bReplay=document.getElementById('aReplay'),lab=document.getElementById('aLabel');
 ctl.classList.add('show');
 const player=new Audio();player.preload='none';
 let on=true,curI=-1;const AKON='pp_narration_on';
 try{if(localStorage.getItem(AKON)==='0')on=false;}catch(e){}
 function paintOn(){bToggle.textContent=on?'🔊':'🔇';bToggle.classList.toggle('off',!on);lab.textContent=on?'Narration':'Muted';}
 player.addEventListener('play',()=>bToggle.classList.add('playing'));
 player.addEventListener('pause',()=>bToggle.classList.remove('playing'));
 player.addEventListener('ended',()=>bToggle.classList.remove('playing'));
 function load(i){const src=AUD[i];player.pause();if(!src){player.removeAttribute('src');return false;}player.src=src;return true;}
 function play(i){if(!on)return;if(!load(i))return;const pr=player.play();if(pr&&pr.catch)pr.catch(()=>{});}
 window.__slideAudio=function(i){curI=i;if(on)play(i);else load(i);};
 bToggle.onclick=()=>{on=!on;try{localStorage.setItem(AKON,on?'1':'0');}catch(e){}paintOn();if(on)play(curI);else player.pause();};
 bReplay.onclick=()=>{if(!on){on=true;try{localStorage.setItem(AKON,'1');}catch(e){}paintOn();}play(curI);};
 function firstGesture(){document.removeEventListener('click',firstGesture);document.removeEventListener('keydown',firstGesture);if(on&&player.paused&&curI>=0)play(curI);}
 document.addEventListener('click',firstGesture);document.addEventListener('keydown',firstGesture);
 paintOn();
 if(on){hint.classList.add('show');setTimeout(()=>hint.classList.remove('show'),4200);}
})();

(function(){
 function setLens(scope){scope.querySelectorAll('.aline').forEach(p=>{try{p.style.setProperty('--len',Math.ceil(p.getTotalLength()));}catch(e){}});}
 function playRoute(fig){setLens(fig);fig.classList.remove('play');void fig.offsetWidth;fig.classList.add('play');}
 const CAP=[['',''],['JULY 1 · The collision','Union falls back to the high ground'],
   ['JULY 2 · The flanks','Both ends attacked — the line holds'],
   ['JULY 3 · Pickett’s Charge','The high-water mark, then the repulse']];
 function setPhase(fig,n){
  fig.dataset.phase=n;

   if(want&&!g.classList.contains('on')){setLens(g);g.classList.add('on');}
   else if(!want)g.classList.remove('on');});
  const c=CAP[n]||['',''];const c1=fig.querySelector('#pcap1'),c2=fig.querySelector('#pcap2');
  if(c1)c1.textContent=c[0];if(c2)c2.textContent=c[1];
  const bar=fig.parentElement.querySelector('.mapctrl');
  if(bar)bar.querySelectorAll('[data-day]').forEach(b=>b.classList.toggle('on',+b.dataset.day<=n));
 }
 function clearTimers(fig){if(fig._t){fig._t.forEach(clearTimeout);}fig._t=[];}
 function playBattle(fig){clearTimers(fig);setPhase(fig,0);[850,2350,3850].forEach((t,i)=>fig._t.push(setTimeout(()=>setPhase(fig,i+1),t)));}
 // wire controls
 document.querySelectorAll('.fig[data-anim="battle"]').forEach(fig=>{
  const bar=fig.parentElement.querySelector('.mapctrl');if(!bar)return;
  bar.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{clearTimers(fig);setPhase(fig,+b.dataset.day);});
  const pl=bar.querySelector('[data-act="play"]');if(pl)pl.onclick=()=>playBattle(fig);
 });
 document.querySelectorAll('.fig.route').forEach(fig=>{
  const bar=fig.parentElement.querySelector('.mapctrl');const rep=bar&&bar.querySelector('[data-act="replay"]');
  if(rep)rep.onclick=()=>playRoute(fig);
 });
 window.__mapAnim=function(slideEl){
  if(!slideEl)return;const fig=slideEl.querySelector('.fig[data-anim]');if(!fig)return;
  if(fig.dataset.anim==='battle')playBattle(fig);else playRoute(fig);
 };
})();

/* ---------------- assessment: perspective tagging + lock + paper ---------------- */
const ASSESS={"ps": "PS2 · Source Evaluation", "title": "Four Voices, One March", "strat": "Point-of-view tagging · match each account to who most likely said it", "intro": "Sherman's march meant something completely different depending on where you stood when it passed. Match each account below to the person most likely to have said it.", "bins": ["A Georgia planter", "A Union soldier", "A freed person", "Gen. Sherman"], "cards": [{"ev": "“We are not only fighting hostile armies, but a hostile people, and must make old and young feel the hard hand of war.”", "ans": 3, "why": "Sherman — this is his own justification for total war: breaking a people's will, not just its army."}, {"ev": "“They burned the gin house and drove off every hog and horse we owned. Forty years of work, gone in a single afternoon.”", "ans": 0, "why": "A Georgia planter — the loss is described from the property owner's side, the world the march destroyed."}, {"ev": "“When the blue coats came down the road, we left the field and followed them. Nobody had to tell us we were free.”", "ans": 2, "why": "A freed person — thousands left the plantations to follow the army toward freedom; for them the march was deliverance."}, {"ev": "“We lived off the land the whole way to Savannah. Hard marching, and little sleep — but the men were never in higher spirits.”", "ans": 1, "why": "A Union soldier — the plain, almost cheerful view of foraging and morale on the road to the sea."}], "honors": "Historian's Challenge: These four saw the same march and remember it in completely different ways. Whose account would a historian trust most to explain <i>why</i> Sherman marched — and why might even the most reliable of them still be incomplete?"};
const AKEY='pp_u2c8_dd_sherman_v1';const MAXATT=2;let A={};
try{A=JSON.parse(localStorage.getItem(AKEY))||{};}catch(e){}
if(!A.attempt)A.attempt=1;A.tag=A.tag||{};
function asave(){try{localStorage.setItem(AKEY,JSON.stringify(A));}catch(e){}}
function setNote(m,ok){const n=document.getElementById('asave');if(n){n.textContent=m;n.classList.toggle('ok',!!ok);}}
function active(){return !A.submitted&&!A.locked;}
function grade(){let r=0;ASSESS.cards.forEach((c,ci)=>{if(A.tag[ci]===c.ans)r++;});return {right:r,total:ASSESS.cards.length};}
function score(){const g=grade();return g.right+'/'+g.total;}
function complete(){return Object.keys(A.tag).length===ASSESS.cards.length;}
function render(){
 const root=document.getElementById('assessroot');if(!root)return;
 let h=`<div class="a-top"><span class="chip">${ASSESS.ps}</span><button class="paperbtn" onclick="openPaper()">📄 Paper version</button></div>
  <h2 class="at">${ASSESS.title}</h2><div class="strat">${ASSESS.strat}</div>
  <div class="policy">🔒 <b>One attempt + one retake, then locked.</b> Your score shows after each attempt; the correct answers reveal only after your final attempt.</div>
  <p class="a-intro">${ASSESS.intro}</p><div class="tagcards">`;
 ASSESS.cards.forEach((c,ci)=>{h+=`<div class="tagcard" data-c="${ci}"><div class="ev">${c.ev}</div><div class="tagbtns">`+
   ASSESS.bins.map((bin,bi)=>`<button class="tagb" data-bin="${bi}">${bin}</button>`).join('')+`</div></div>`;});
 h+=`</div><div id="ctrl" class="checkbar"></div><div class="savenote" id="asave"></div>
  <details class="honors"><summary>Historian's Challenge (honors extension)</summary><div class="in"><p>${ASSESS.honors}</p>
  <textarea class="ta" id="honorsTa" rows="3" placeholder="Optional — stretch your thinking here."></textarea></div></details>
  <div class="foot-ret"><button id="retBtn">← Back to the chapter</button></div>`;
 root.innerHTML=h;
 const ta=document.getElementById('honorsTa');if(ta){if(A.honors)ta.value=A.honors;ta.addEventListener('input',()=>{A.honors=ta.value;asave();});}
 document.querySelectorAll('#assessroot .tagcard').forEach(card=>{const ci=+card.dataset.c;
  card.querySelectorAll('.tagb').forEach(btn=>btn.onclick=()=>{if(!active())return;A.tag[ci]=+btn.dataset.bin;asave();
   card.querySelectorAll('.tagb').forEach(x=>x.classList.toggle('sel',+x.dataset.bin===A.tag[ci]));});});
 const rb=document.getElementById('retBtn');if(rb)rb.onclick=()=>{if(window.__goBackToChapter)window.__goBackToChapter();};
 sync();
}
function marks(show,reveal){
 document.querySelectorAll('#assessroot .tagcard').forEach(card=>{const ci=+card.dataset.c;card.classList.remove('ok','no');
  card.querySelectorAll('.tagb').forEach(x=>{x.classList.toggle('sel',+x.dataset.bin===A.tag[ci]);x.classList.toggle('locked',show);});
  const old=card.querySelector('.tagwhy');if(old)old.remove();
  if(!show)return;const good=A.tag[ci]===ASSESS.cards[ci].ans;card.classList.toggle('ok',good);card.classList.toggle('no',!good);
  if(reveal){const w=document.createElement('div');w.className='tagwhy';
   w.innerHTML=(good?'✓ ':`✗ Best answer: <b>${ASSESS.bins[ASSESS.cards[ci].ans]}</b>. `)+ASSESS.cards[ci].why;card.appendChild(w);}});
}
function ctrl(){const c=document.getElementById('ctrl');if(!c)return;
 if(A.locked){c.innerHTML=`<div class="lockbanner">🔒 Locked — final score ${score()} · attempt ${A.attempt} of ${MAXATT}. This is recorded.</div>`;return;}
 if(!A.submitted){c.innerHTML=`<button class="btn" id="sub">Submit ${A.attempt===MAXATT?'final ':''}answers</button>`;document.getElementById('sub').onclick=submit;return;}
 c.innerHTML=`<div class="scoreline">Attempt ${A.attempt} of ${MAXATT} · score <b>${score()}</b>. The correct answers stay hidden until your final attempt.</div>
  <button class="btn" id="ret">🔁 Retake — last attempt</button><button class="btn ghost" id="lok">Lock in &amp; reveal answers</button>`;
 document.getElementById('ret').onclick=retake;document.getElementById('lok').onclick=lockin;
}
function sync(){const show=!!(A.submitted||A.locked);marks(show,!!A.locked);ctrl();
 setNote(A.locked?'Locked — the answers are revealed above.':(A.submitted?'Attempt recorded — score '+score()+'.':'Your work saves automatically — you can close the tab and come back on this computer.'),!!A.locked);}
function submit(){if(!complete()){setNote('Tag every card before you submit.',false);return;}A.submitted=true;if(A.attempt>=MAXATT)A.locked=true;asave();sync();}
function retake(){A.attempt=Math.min(MAXATT,A.attempt+1);A.submitted=false;A.tag={};asave();render();setNote('This is your last attempt — it locks when you submit.',false);}
function lockin(){A.locked=true;asave();sync();}

 if(paperKey)h+=`<div class="key"><h3>Answer key</h3>`+ASSESS.cards.map((c,ci)=>`<p>${ci+1}. ${'ABCD'[c.ans]} (${ASSESS.bins[c.ans]}) — ${c.why}</p>`).join('')+`</div>`;
 h+=`<div class="pq" style="margin-top:22px"><b>★ Historian's Challenge (honors):</b> ${ASSESS.honors.replace(/<[^>]+>/g,'')}</div><div class="writeline"></div><div class="writeline"></div><div class="writeline"></div>`;
 document.getElementById('sheet').innerHTML=h;
}
